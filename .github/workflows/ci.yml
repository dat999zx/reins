name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc -p packages/server/tsconfig.dist-check.json
      - run: npm run lint
      - run: npm test
      # the real install route: pack the published package, install it clean, run it
      - run: npm pack --pack-destination "$RUNNER_TEMP" -w packages/server && cd "$RUNNER_TEMP" && npm init -y && npm i ./dat999zx-reins-*.tgz && npx reins check "$GITHUB_WORKSPACE/examples/bug-fix.reins.md"
        shell: bash
